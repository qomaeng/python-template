[project]
name = "template"
version = "0.0.1"
description = "Python template"
authors = [{ name = "qomaeng", email = "qomaeng@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
  "coverage>=7.15.4",
  "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/.*", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[[tool.pyright.executionEnvironments]]
root = "src"

[tool.ruff]
include = ["pyproject.toml", "{src,tests}/**/*.{py,pyi}"]
extend-exclude = ["**/.*"]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
  "ERA",   # eradicate
  "FAST",  # fastapi
  "ANN",   # flake8-annotations
  "ASYNC", # flake8-async
  "S",     # flake8-bandit (security)
  "B",     # flake8-bugbear
  "A",     # flake8-builtins
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "T10",   # flake8-debugger
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "G",     # flake8-logging-format
  "PIE",   # flake8-pie
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "RSE",   # flake8-raise
  "RET",   # flake8-return
  "SLF",   # flake8-self
  "SIM",   # flake8-simplify
  "SLOT",  # flake8-slots
  "TID",   # flake8-tidy-imports
  "TD",    # flake8-todos
  "TC",    # flake8-type-checking
  "ARG",   # flake8-unused-arguments
  "PTH",   # flake8-use-pathlib
  "FLY",   # flynt
  "I",     # isort
  "NPY",   # numpy-specific rules
  "PD",    # pandas-vet
  "N",     # pep8-naming
  "PERF",  # perflint
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "PGH",   # pygrep-hooks
  "PL",    # pylint
  "UP",    # pyupgrade
  "FURB",  # refurb
  "RUF",   # ruff-specifc rules
  "TRY",   # tryceratops
]

ignore = [
  "ANN401", # any-type
  "B008",   # function-call-in-default-argument
  "EM101",  # raw-string-in-exception
  "EM102",  # f-string-in-exception
  "TD002",  # missing-todo-author
  "TD003",  # missing-todo-link
  "ARG001", # unused-function-argument
  "ARG002", # unused-method-argument
  "ARG004", # unused-static-method-argument
  "E501",   # line-too-long
  "TRY003", # raise-vanilla-args
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",   # assert
  "SLF001", # private-member-access
]
"alembic/**/*.py" = [
  "ERA001", # commented-out-code
]
"migrations/**/*.py" = [
  "ERA001", # commented-out-code
]
"__init__.py" = [
  "F401",   # unused-import
]
"scripts/**/*.py" = [
  "T201",   # print
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
omit = ["**/.*"]
show_missing = true

[tool.coverage.html]
show_contexts = true
